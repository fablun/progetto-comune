site_name: Progetto Comune
site_description: Le migliori istituzioni che l'umanità ha costruito, messe insieme per una società più giusta, ricca e felice.
site_url: https://fablun.github.io/progetto-comune/
repo_url: https://github.com/fablun/progetto-comune
repo_name: progetto-comune
edit_uri: edit/main/docs/

theme:
  name: material
  language: it
  font:
    text: Source Serif 4
    code: IBM Plex Mono
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Tema scuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Tema chiaro
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/comune.css

plugins:
  - search:
      lang: it

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

nav:
  - Il progetto:
      - index.md
      - Il metodo: metodo.md
      - La mappa del documento: indice.md
  - La biblioteca:
      - aree/index.md
      - Risorse e conflitti:
          - aree/risorse-e-conflitti/index.md
          - Beni comuni autogestiti (Ostrom): aree/risorse-e-conflitti/beni-comuni-ostrom.md
          - Carbone e acciaio in comune (CECA): aree/risorse-e-conflitti/comunita-carbone-acciaio.md
          - Il fondo sovrano (Norvegia): aree/risorse-e-conflitti/fondo-sovrano-norvegese.md
          - Il dividendo delle risorse (Alaska): aree/risorse-e-conflitti/dividendo-alaska.md
          - Lo Stato socio delle miniere (Botswana): aree/risorse-e-conflitti/diamanti-botswana.md
          - La trasparenza estrattiva (EITI): aree/risorse-e-conflitti/trasparenza-eiti.md
          - Dividere l'acqua (Indo): aree/risorse-e-conflitti/trattato-acque-indo.md
          - Le opere comuni (fiume Senegal): aree/risorse-e-conflitti/fiume-senegal-omvs.md
          - La terra a chi la lavora (Asia orientale): aree/risorse-e-conflitti/riforma-agraria-asia.md
          - Le quote di pesca (Islanda, N. Zelanda): aree/risorse-e-conflitti/quote-pesca.md
      - Decisione politica:
          - aree/decisione-politica/index.md
          - Assemblea dei cittadini (Irlanda): aree/decisione-politica/assemblea-cittadini-irlanda.md
          - Consiglio permanente (Ostbelgien): aree/decisione-politica/consiglio-cittadini-ostbelgien.md
          - Democrazia diretta (Svizzera): aree/decisione-politica/democrazia-diretta-svizzera.md
          - Deliberazione digitale (Taiwan): aree/decisione-politica/deliberazione-digitale-taiwan.md
          - Bilancio partecipativo (Porto Alegre): aree/decisione-politica/bilancio-partecipativo-porto-alegre.md
          - Decentramento (Kerala): aree/decisione-politica/pianificazione-popolare-kerala.md
          - Proporzionale misto (Nuova Zelanda): aree/decisione-politica/proporzionale-misto-nuova-zelanda.md
          - Arbitri indipendenti (Australia): aree/decisione-politica/commissione-elettorale-australia.md
          - Buoni per la democrazia (Seattle): aree/decisione-politica/buoni-democrazia-seattle.md
          - Costituzione dei cittadini (Islanda): aree/decisione-politica/costituzione-partecipata-islanda.md
      - Economia e lavoro:
          - aree/economia-e-lavoro/index.md
          - Flessibilità con sicurezza (Danimarca): aree/economia-e-lavoro/flexicurity-danimarca.md
          - Cogestione (Germania): aree/economia-e-lavoro/cogestione-germania.md
          - Cooperative in rete (Mondragón): aree/economia-e-lavoro/cooperative-mondragon.md
          - Formazione duale (Germania, Svizzera): aree/economia-e-lavoro/formazione-duale.md
          - Ridurre l'orario (Kurzarbeit): aree/economia-e-lavoro/kurzarbeit.md
          - Salario minimo (Regno Unito): aree/economia-e-lavoro/salario-minimo-commissione.md
          - Uscire dalla povertà (Bangladesh): aree/economia-e-lavoro/programma-graduazione-brac.md
          - Politica industriale (Corea del Sud): aree/economia-e-lavoro/politica-industriale-corea.md
          - Uscire dal sommerso (Brasile): aree/economia-e-lavoro/semplificazione-fiscale-brasile.md
          - Lavoratori proprietari (USA, Regno Unito): aree/economia-e-lavoro/azionariato-dipendenti.md
      - Welfare, salute e casa:
          - aree/welfare-salute-casa/index.md
          - Sanità universale (Thailandia): aree/welfare-salute-casa/sanita-universale-thailandia.md
          - Squadre di salute di quartiere (Brasile): aree/welfare-salute-casa/medicina-famiglia-brasile.md
          - Assicurazione comunitaria (Ruanda): aree/welfare-salute-casa/assicurazione-comunitaria-ruanda.md
          - Casa sociale per la maggioranza (Vienna): aree/welfare-salute-casa/casa-sociale-vienna.md
          - Nazione di proprietari (Singapore): aree/welfare-salute-casa/casa-pubblica-singapore.md
          - Prima la casa (Finlandia, Canada): aree/welfare-salute-casa/housing-first.md
          - Trasferimenti condizionati (Messico, Brasile): aree/welfare-salute-casa/trasferimenti-condizionati.md
          - Reddito di base (Finlandia): aree/welfare-salute-casa/reddito-base-finlandia.md
          - Pensioni che si aggiustano (Svezia, Cile): aree/welfare-salute-casa/pensioni-svezia-cile.md
          - Asili universali (Québec): aree/welfare-salute-casa/asili-quebec.md
  - Partecipa:
      - contribuire.md
      - Modello di scheda: modello-scheda.md
      - Registro delle modifiche: registro.md

extra:
  generator: false

